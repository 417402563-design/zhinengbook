spring:
  application:
    name: zhinengbook
  datasource:
    # 内置H2数据库，数据文件保存在当前项目目录下 ./data/zhinengbook.mv.db
    url: jdbc:h2:file:./data/zhinengbook;AUTO_SERVER=TRUE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      continue-on-error: true
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
  web:
    resources:
      static-locations: classpath:/static/

server:
  port: 8080

# 大模型API配置（可在系统管理的密钥管理中动态覆盖）
llm:
  provider: dashscope
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
  api-key: ''            # 留空则使用数据库中的激活密钥；无密钥时自动降级为本地模拟生成
  timeout-seconds: 60
  mock-when-no-key: true
  fallback-to-mock-on-error: true   # 真实调用失败时自动降级为本地模拟，保障写作不中断

# 内容安全过滤配置
safety:
  enabled: true
  sensitive-words:
    - 暴力
    - 赌博
    - 毒品
    - 诈骗
    - 传销
    - 贩毒
    - 枪支
    - 黄色
  replacement: '**'

# 计费配置（每1K token单价，单位：元）
billing:
  price-per-1k-tokens: 0.01
  free-tokens-per-user: 100000
